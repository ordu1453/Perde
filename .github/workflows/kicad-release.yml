name: KiCad Release (main-board)

# Tag pushes are excluded from path-filtering in kicad-ci.yml (a tag on an
# existing commit has no "changed files" of its own), so this runs as a
# separate workflow whenever a vX.Y.Z tag is pushed.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PROJECT_DIR: hw/main-board

jobs:
  build:
    name: Build fabrication package
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto_full:latest
    steps:
      - uses: actions/checkout@v4

      # Same KICAD_CI_STRICT toggle as kicad-ci.yml (see its header):
      # lenient by default so an early-stage design doesn't block a build,
      # set the repo variable KICAD_CI_STRICT=true to fail this job for
      # real on a broken release instead of shipping it silently.
      - name: Generate all outputs
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: ${{ vars.KICAD_CI_STRICT != 'true' }}
        run: |
          kibot -D -c main-board.kibot.yaml \
                -e main-board.kicad_sch \
                -b main-board.kicad_pcb \
                -d Output \
                schematic_pdf pcb_pdf \
                _JLCPCB_gerbers _JLCPCB_drill _JLCPCB_position _JLCPCB_bom _JLCPCB_compress \
                _PCBWay_gerbers _PCBWay_drill _PCBWay_compress \
                position bom bom_csv step render_top render_bottom

      - name: Upload release package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ${{ env.PROJECT_DIR }}/Output
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    # softprops/action-gh-release needs a tag ref to attach the release to.
    # Without this guard, a manual workflow_dispatch run (branch ref, no
    # tag) would build fine and then fail here.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: Output

      - name: Create/update release with fabrication package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/**/*.zip
            Output/**/*.csv
            Output/**/*.html
            Output/**/*.pdf
            Output/3D/**
