name: KiCad CI (main-board)

on:
  push:
    branches: ['**']
    paths:
      - 'hw/main-board/**'
      - '.github/workflows/kicad-ci.yml'
  pull_request:
    paths:
      - 'hw/main-board/**'
      - '.github/workflows/kicad-ci.yml'
  workflow_dispatch: {}

# Cancel superseded runs on the same branch/PR
concurrency:
  group: kicad-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: hw/main-board

jobs:
  # ERC/DRC + schematic/PCB PDFs. The project is early-stage (empty sch/PCB),
  # so ERC/DRC errors are expected and must NOT break the pipeline: -D makes
  # KiBot keep going after a failed output, and continue-on-error keeps this
  # step (and therefore the job, and anything that needs it) green even if
  # KiBot itself exits non-zero. The full ERC/DRC report still lands in the
  # uploaded artifact, so problems stay visible without blocking anything.
  validate:
    name: ERC / DRC + docs
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ERC/DRC and generate PDFs
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          kibot -D -c main-board.kibot.yaml \
                -e main-board.kicad_sch \
                -b main-board.kicad_pcb \
                -d Output \
                schematic_pdf pcb_pdf

      - name: Upload checks + docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-and-docs
          path: ${{ env.PROJECT_DIR }}/Output
          if-no-files-found: warn

  fabrication:
    name: Gerbers / drill / BOM / STEP
    needs: validate
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fabrication outputs
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          kibot -D -c main-board.kibot.yaml \
                -e main-board.kicad_sch \
                -b main-board.kicad_pcb \
                -d Output \
                -s erc,drc \
                _JLCPCB_gerbers _JLCPCB_drill _JLCPCB_position _JLCPCB_bom _JLCPCB_compress \
                _PCBWay_gerbers _PCBWay_drill _PCBWay_compress \
                position bom bom_csv step

      - name: Upload fabrication outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabrication
          path: ${{ env.PROJECT_DIR }}/Output
          if-no-files-found: warn

  render:
    name: 3D renders (Blender)
    needs: validate
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto_full:latest
    steps:
      - uses: actions/checkout@v4

      - name: Render top/bottom views
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          kibot -D -c main-board.kibot.yaml \
                -e main-board.kicad_sch \
                -b main-board.kicad_pcb \
                -d Output \
                -s erc,drc \
                render_top render_bottom

      - name: Upload 3D renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3d-renders
          path: ${{ env.PROJECT_DIR }}/Output
          if-no-files-found: warn

  # Visual diff of the PCB/schematic (KiDiff, driven through KiBot's `diff`
  # output). On a PR: diffs against the PR base branch. On a direct push
  # (no PR): diffs against the commit before the push, so plain pushes to
  # main also get a visual diff, not just PRs.
  visual-diff:
    name: Visual diff (KiDiff)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Determine comparison ref
        id: diffref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "old=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "old=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # First push of a new branch: nothing to diff against.
            echo "old=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate PCB/schematic diff
        if: steps.diffref.outputs.old != ''
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          kibot -D -c main-board.kibot.yaml \
                -e main-board.kicad_sch \
                -b main-board.kicad_pcb \
                -d Output \
                -s erc,drc \
                -E KIBOT_DIFF_OLD=${{ steps.diffref.outputs.old }} \
                diff_pcb diff_sch

      - name: Upload diff PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: ${{ env.PROJECT_DIR }}/Output/Diff
          if-no-files-found: warn

  # Mirrors this run's artifacts to gh-pages/latest/, then regenerates a
  # KiCanvas viewer and a KiBot navigate_results index over the merged
  # tree so the page is real navigation instead of a flat file list.
  # Only for pushes to main.
  publish-latest:
    name: Publish latest build to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, fabrication, render, visual-diff]
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Reconstruct the directory layout main-board.kibot.yaml's outputs
      # expect (dir: per output), so navigate_results can find every file
      # at the same path its own definition points to. Every job uploaded
      # its Output/ subtree as-is, except visual-diff, which uploaded
      # Output/Diff/* directly (its artifact root *is* Diff/), so that one
      # needs re-nesting back under Diff/.
      - name: Reassemble the KiBot output tree
        run: |
          rm -rf Output
          mkdir -p Output/Diff
          cp -r artifacts/checks-and-docs/. Output/ 2>/dev/null || true
          cp -r artifacts/fabrication/. Output/ 2>/dev/null || true
          cp -r artifacts/3d-renders/. Output/ 2>/dev/null || true
          cp -r artifacts/visual-diff/. Output/Diff/ 2>/dev/null || true

      - name: Generate viewer and navigation index
        continue-on-error: true
        run: |
          kibot -D -c ${{ env.PROJECT_DIR }}/main-board.kibot.yaml \
                -e ${{ env.PROJECT_DIR }}/main-board.kicad_sch \
                -b ${{ env.PROJECT_DIR }}/main-board.kicad_pcb \
                -d Output \
                -s erc,drc \
                kicanvas navigate_results

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Publish to gh-pages/latest
        shell: bash
        run: |
          set -e
          rm -rf gh-pages/latest
          cp -r Output gh-pages/latest
          cd gh-pages
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add latest
          git commit -m "Update latest build (main@${GITHUB_SHA::7})" || echo "Nothing to commit"
          git push origin gh-pages
