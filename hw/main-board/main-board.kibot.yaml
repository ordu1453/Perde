# KiBot config for main-board (KiCad 10)
# Docs: https://kibot.readthedocs.io/
kibot:
  version: 1

# Built-in fab-house templates instead of hand-rolled gerber/drill options.
# Each ships its own dir (JLCPCB/, PCBWay/) and its own gerbers+drill ZIP;
# JLCPCB's template additionally includes an LCSC-formatted BOM/position.
# https://github.com/INTI-CMNB/KiBot/tree/master/kibot/resources/config_templates
import:
  - file: JLCPCB
  - file: PCBWay

preflight:
  # dont_stop: a preflight failure (e.g. missing board outline) would
  # otherwise abort the whole run before any output is generated - even
  # ones like schematic_pdf that don't depend on ERC/DRC passing. With
  # dont_stop, KiBot still reports the failure (see the html report) but
  # continues on to generate the requested outputs.
  erc:
    dont_stop: true
  drc:
    dont_stop: true

outputs:
  # --- Documentation ---
  - name: 'schematic_pdf'
    comment: 'Schematic in PDF'
    type: pdf_sch_print
    dir: Documentation
    options:
      output: Schematic.pdf

  - name: 'pcb_pdf'
    comment: 'PCB layers in PDF'
    type: pcb_print
    dir: Documentation
    options:
      output: PCB.pdf

  # --- Assembly ---
  - name: 'position'
    comment: 'Pick and place file'
    type: position
    dir: Fabrication/Assembly
    options:
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: true
      only_smd: true

  - name: 'bom'
    comment: 'Bill of Materials (HTML)'
    type: bom
    dir: Fabrication/Assembly
    options:
      format: HTML
      normalize_values: true
      columns:
        - Row
        - References
        - Value
        - Footprint
        - Quantity Per PCB

  - name: 'bom_csv'
    comment: 'Bill of Materials (CSV)'
    type: bom
    dir: Fabrication/Assembly
    options:
      format: CSV
      normalize_values: true

  # --- 3D ---
  - name: 'step'
    comment: '3D model (STEP)'
    type: export_3d
    dir: 3D
    options:
      format: step
      units: millimeters

  - name: 'render_top'
    comment: '3D render, top view'
    type: render_3d
    dir: 3D
    options:
      view: top

  - name: 'render_bottom'
    comment: '3D render, bottom view'
    type: render_3d
    dir: 3D
    options:
      view: bottom

  # --- Visual diff between two git points (KiDiff, wrapped by KiBot) ---
  # @KIBOT_DIFF_OLD@ must be supplied via `-E KIBOT_DIFF_OLD=<ref>` (CI does
  # this, pointing at the PR base branch). These targets are never part of
  # the default output list, so this is only resolved when explicitly run:
  #   kibot -E KIBOT_DIFF_OLD=origin/main diff_pcb diff_sch
  - name: 'diff_pcb'
    comment: 'Visual diff of the PCB vs. a previous git revision'
    type: diff
    dir: Diff
    options:
      pcb: true
      old: '@KIBOT_DIFF_OLD@'
      old_type: git
      new_type: current
      diff_mode: red_green
      only_different: true

  - name: 'diff_sch'
    comment: 'Visual diff of the schematic vs. a previous git revision'
    type: diff
    dir: Diff
    options:
      pcb: false
      old: '@KIBOT_DIFF_OLD@'
      old_type: git
      new_type: current
      diff_mode: red_green
      only_different: true
