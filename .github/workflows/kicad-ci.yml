name: KiCad CI (main-board)

on:
  push:
    branches: ['**']
    paths:
      - 'hw/main-board/**'
      - '.github/workflows/kicad-ci.yml'
  pull_request:
    paths:
      - 'hw/main-board/**'
      - '.github/workflows/kicad-ci.yml'
  workflow_dispatch: {}

# Cancel superseded runs on the same branch/PR
concurrency:
  group: kicad-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: hw/main-board

jobs:
  # ERC/DRC + schematic/PCB PDFs. The project is early-stage (empty sch/PCB),
  # so ERC/DRC errors are expected and must NOT break the pipeline: -D makes
  # KiBot keep going after a failed output, and continue-on-error keeps this
  # step (and therefore the job, and anything that needs it) green even if
  # KiBot itself exits non-zero. The full ERC/DRC report still lands in the
  # uploaded artifact, so problems stay visible without blocking anything.
  validate:
    name: ERC / DRC + docs
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ERC/DRC and generate PDFs
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          kibot -D -c main-board.kibot.yaml \
                -e main-board.kicad_sch \
                -b main-board.kicad_pcb \
                -d Output \
                schematic_pdf pcb_pdf

      - name: Upload checks + docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-and-docs
          path: ${{ env.PROJECT_DIR }}/Output
          if-no-files-found: warn

  fabrication:
    name: Gerbers / drill / BOM / STEP
    needs: validate
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate fabrication outputs
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          kibot -D -c main-board.kibot.yaml \
                -e main-board.kicad_sch \
                -b main-board.kicad_pcb \
                -d Output \
                -s erc,drc \
                _JLCPCB_gerbers _JLCPCB_drill _JLCPCB_position _JLCPCB_bom _JLCPCB_compress \
                _PCBWay_gerbers _PCBWay_drill _PCBWay_compress \
                position bom bom_csv step

      - name: Upload fabrication outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabrication
          path: ${{ env.PROJECT_DIR }}/Output
          if-no-files-found: warn

  render:
    name: 3D renders (Blender)
    needs: validate
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto_full:latest
    steps:
      - uses: actions/checkout@v4

      - name: Render top/bottom views
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          kibot -D -c main-board.kibot.yaml \
                -e main-board.kicad_sch \
                -b main-board.kicad_pcb \
                -d Output \
                -s erc,drc \
                render_top render_bottom

      - name: Upload 3D renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3d-renders
          path: ${{ env.PROJECT_DIR }}/Output
          if-no-files-found: warn

  # Visual diff of the PCB/schematic (KiDiff, driven through KiBot's `diff`
  # output). On a PR: diffs against the PR base branch. On a direct push
  # (no PR): diffs against the commit before the push, so plain pushes to
  # main also get a visual diff, not just PRs.
  visual-diff:
    name: Visual diff (KiDiff)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Determine comparison ref
        id: diffref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "old=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "old=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # First push of a new branch: nothing to diff against.
            echo "old=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate PCB/schematic diff
        if: steps.diffref.outputs.old != ''
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          kibot -D -c main-board.kibot.yaml \
                -e main-board.kicad_sch \
                -b main-board.kicad_pcb \
                -d Output \
                -s erc,drc \
                -E KIBOT_DIFF_OLD=${{ steps.diffref.outputs.old }} \
                diff_pcb diff_sch

      - name: Upload diff PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: ${{ env.PROJECT_DIR }}/Output/Diff
          if-no-files-found: warn

  # Mirrors this run's artifacts to gh-pages/latest/ with a plain index, so
  # gerbers/BOM/renders/diff are reachable by a stable direct link instead
  # of having to open the Actions run and download a zip. Only for pushes
  # to main.
  publish-latest:
    name: Publish latest build to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, fabrication, render, visual-diff]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build latest/ folder with an index page
        run: |
          set -e
          rm -rf site
          mkdir -p site/latest
          cp -r artifacts/* site/latest/ 2>/dev/null || true

          {
            echo "<!doctype html><meta charset=\"utf-8\">"
            echo "<title>Perde main-board — latest build</title>"
            echo "<h1>Perde main-board — latest build</h1>"
            echo "<p>Commit: <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">${{ github.sha }}</a><br>"
            echo "Built: $(date -u +'%Y-%m-%d %H:%M UTC')</p>"
            echo "<ul>"
            find site/latest -type f ! -name index.html | sed 's#^site/##' | sort | \
              while read -r f; do echo "<li><a href=\"/Perde/$f\">$f</a></li>"; done
            echo "</ul>"
          } > site/latest/index.html

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Publish to gh-pages/latest
        run: |
          set -e
          rm -rf gh-pages/latest
          cp -r site/latest gh-pages/latest
          cd gh-pages
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add latest
          git commit -m "Update latest build (main@${GITHUB_SHA::7})" || echo "Nothing to commit"
          git push origin gh-pages
